<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lim Ker Sin provides flexible freelance support in typing, translation, consultation, assignment assistance, Excel reporting, creative projects, LEGO and puzzle assembly, and video editing in Kuala Lumpur, Malaysia.">
    <meta name="theme-color" content="#5B4FE9">
    <meta property="og:title" content="Lim Ker Sin | Professional Services Portfolio">
    <meta property="og:description" content="Flexible freelance support across documents, data, creative work, assembly, and video editing.">
    <meta property="og:type" content="website">
    <title>Lim Ker Sin | Professional Services Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
/* ================================
   Reset & Base
================================ */
*,
*::before,
*::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    /* Colors */
    --bg: #F8F9FA;
    --bg-white: #FFFFFF;
    --text: #1A1A2E;
    --text-light: #5A5A72;
    --text-muted: #8E8EA0;
    --primary: #5B4FE9;
    --primary-dark: #4338CA;
    --primary-light: #EDEAFF;
    --accent: #F97316;
    --accent-light: #FFF4EC;
    --border: #E5E5F0;
    --shadow-sm: 0 2px 8px rgba(26, 26, 46, 0.06);
    --shadow-md: 0 4px 24px rgba(26, 26, 46, 0.08);
    --shadow-lg: 0 12px 48px rgba(26, 26, 46, 0.12);

    /* Typography */
    --font-head: 'Poppins', sans-serif;
    --font-body: 'Inter', sans-serif;

    /* Spacing */
    --section-pad: 100px;
    --container-max: 1200px;
    --radius-sm: 8px;
    --radius-md: 16px;
    --radius-lg: 24px;

    /* Transition */
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

html {
    scroll-behavior: smooth;
    font-size: 16px;
}

body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
}

img, svg {
    max-width: 100%;
    display: block;
}

a {
    text-decoration: none;
    color: inherit;
}

ul {
    list-style: none;
}

/* ================================
   Layout Helpers
================================ */
.container {
    max-width: var(--container-max);
    margin: 0 auto;
    padding: 0 24px;
}

.section {
    padding: var(--section-pad) 0;
}

.section-header {
    text-align: center;
    margin-bottom: 64px;
}

.section-label {
    display: inline-block;
    font-family: var(--font-head);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--primary);
    margin-bottom: 12px;
}

.section-title {
    font-family: var(--font-head);
    font-size: clamp(2rem, 4vw, 2.75rem);
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
}

.section-subtitle {
    margin-top: 16px;
    color: var(--text-light);
    font-size: 1.05rem;
}

/* ================================
   Buttons
================================ */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 0.95rem;
    padding: 14px 32px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    transition: var(--transition);
    letter-spacing: 0.3px;
}

.btn-primary {
    background: var(--primary);
    color: #fff;
}

.btn-primary:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(91, 79, 233, 0.3);
}

.btn-secondary {
    background: transparent;
    color: var(--text);
    border: 2px solid var(--border);
}

.btn-secondary:hover {
    border-color: var(--primary);
    color: var(--primary);
}

.btn-large {
    padding: 18px 48px;
    font-size: 1.05rem;
}

.btn-full {
    width: 100%;
}

/* ================================
   Navigation
================================ */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    background: rgba(248, 249, 250, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid transparent;
    transition: var(--transition);
}

.navbar.scrolled {
    border-bottom-color: var(--border);
    box-shadow: var(--shadow-sm);
}

.nav-container {
    max-width: var(--container-max);
    margin: 0 auto;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.nav-logo {
    font-family: var(--font-head);
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text);
}

.nav-logo span {
    color: var(--primary);
}

.nav-menu {
    display: flex;
    gap: 36px;
}

.nav-link {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text-light);
    position: relative;
    transition: var(--transition);
}

.nav-link::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--primary);
    transition: var(--transition);
}

.nav-link:hover,
.nav-link.active {
    color: var(--primary);
}

.nav-link:hover::after,
.nav-link.active::after {
    width: 100%;
}

.nav-toggle {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
}

.nav-toggle span {
    width: 26px;
    height: 2px;
    background: var(--text);
    border-radius: 2px;
    transition: var(--transition);
}

.nav-toggle.active span:nth-child(1) {
    transform: rotate(45deg) translate(5px, 5px);
}
.nav-toggle.active span:nth-child(2) {
    opacity: 0;
}
.nav-toggle.active span:nth-child(3) {
    transform: rotate(-45deg) translate(7px, -7px);
}

/* ================================
   Hero
================================ */
.hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    background: var(--bg-white);
}

.hero-bg-pattern {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image:
        radial-gradient(circle at 20% 30%, rgba(91, 79, 233, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(249, 115, 22, 0.05) 0%, transparent 50%);
}

.hero-bg-pattern::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: radial-gradient(circle, rgba(91, 79, 233, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
}

.hero-content {
    position: relative;
    z-index: 1;
    max-width: 780px;
    padding: 0 24px;
    animation: fadeInUp 0.8s ease;
}

.hero-greeting {
    font-family: var(--font-head);
    font-size: 1.1rem;
    color: var(--primary);
    font-weight: 500;
    margin-bottom: 8px;
}

.hero-name {
    font-family: var(--font-head);
    font-size: clamp(2.5rem, 7vw, 4.5rem);
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 12px;
    background: linear-gradient(135deg, var(--text) 0%, var(--primary) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

.hero-tagline {
    font-family: var(--font-head);
    font-size: clamp(1.1rem, 2.5vw, 1.5rem);
    font-weight: 600;
    color: var(--text);
    margin-bottom: 20px;
}

.hero-description {
    font-size: 1.1rem;
    color: var(--text-light);
    max-width: 600px;
    margin: 0 auto 36px;
    line-height: 1.7;
}

.hero-buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-bottom: 64px;
    flex-wrap: wrap;
}

.hero-stats {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
}

.stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.stat-number {
    font-family: var(--font-head);
    font-size: 2rem;
    font-weight: 700;
    color: var(--primary);
}

.stat-label {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: 4px;
}

.stat-divider {
    width: 1px;
    height: 40px;
    background: var(--border);
}

.scroll-indicator {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
}

.scroll-line {
    width: 1px;
    height: 40px;
    background: var(--border);
    position: relative;
    overflow: hidden;
}

.scroll-line::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 50%;
    background: var(--primary);
    animation: scrollDown 1.8s ease-in-out infinite;
}

@keyframes scrollDown {
    0% { top: -50%; }
    100% { top: 100%; }
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ================================
   About
================================ */
.about {
    background: var(--bg-white);
}

.about-grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 64px;
    align-items: center;
}

.about-text p {
    font-size: 1.05rem;
    color: var(--text-light);
    margin-bottom: 20px;
    line-height: 1.8;
}

.about-qualities {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 28px;
}

.quality-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--primary-light);
    border-radius: 50px;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--primary-dark);
}

.quality-badge svg {
    width: 16px;
    height: 16px;
    color: var(--primary);
}

.about-visual {
    display: flex;
    justify-content: center;
}

.about-card {
    background: linear-gradient(135deg, var(--primary-light) 0%, #fff 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 48px 40px;
    text-align: center;
    max-width: 360px;
    box-shadow: var(--shadow-md);
    transition: var(--transition);
}

.about-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
}

.about-card-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 24px;
    background: var(--primary);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
}

.about-card-icon svg {
    width: 36px;
    height: 36px;
}

.about-card h3 {
    font-family: var(--font-head);
    font-size: 1.3rem;
    margin-bottom: 12px;
    color: var(--text);
}

.about-card p {
    font-size: 0.95rem;
    color: var(--text-light);
    line-height: 1.6;
}

/* ================================
   Services
================================ */
.services {
    background: var(--bg);
}

.services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
}

.service-card {
    background: var(--bg-white);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 36px 28px;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
}

.service-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 4px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    transform: scaleX(0);
    transform-origin: left;
    transition: var(--transition);
}

.service-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-lg);
    border-color: transparent;
}

.service-card:hover::before {
    transform: scaleX(1);
}

.service-icon {
    width: 56px;
    height: 56px;
    background: var(--primary-light);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary);
    margin-bottom: 20px;
    transition: var(--transition);
}

.service-card:hover .service-icon {
    background: var(--primary);
    color: #fff;
    transform: rotate(-5deg) scale(1.05);
}

.service-icon svg {
    width: 28px;
    height: 28px;
}

.service-card h3 {
    font-family: var(--font-head);
    font-size: 1.2rem;
    font-weight: 600;
    margin-bottom: 10px;
    color: var(--text);
}

.service-card p {
    font-size: 0.92rem;
    color: var(--text-light);
    line-height: 1.65;
}

/* ================================
   Gallery
================================ */
.gallery {
    background: var(--bg-white);
}

.gallery-filters {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 48px;
}

.filter-btn {
    font-family: var(--font-head);
    font-size: 0.875rem;
    font-weight: 500;
    padding: 10px 24px;
    border-radius: 50px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text-light);
    cursor: pointer;
    transition: var(--transition);
}

.filter-btn:hover,
.filter-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
}

.gallery-item {
    position: relative;
    border-radius: var(--radius-md);
    overflow: hidden;
    aspect-ratio: 4/3;
    cursor: pointer;
    transition: var(--transition);
}

.gallery-item:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
}

.gallery-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
}

.gallery-placeholder svg {
    width: 64px;
    height: 64px;
    color: rgba(255, 255, 255, 0.7);
    transition: var(--transition);
}

.gallery-item:hover .gallery-placeholder svg {
    transform: scale(1.15);
}

/* Gradient backgrounds for gallery items */
.gallery-grad-1 { background: linear-gradient(135deg, #667eea, #764ba2); }
.gallery-grad-2 { background: linear-gradient(135deg, #f093fb, #f5576c); }
.gallery-grad-3 { background: linear-gradient(135deg, #4facfe, #00f2fe); }
.gallery-grad-4 { background: linear-gradient(135deg, #43e97b, #38f9d7); }
.gallery-grad-5 { background: linear-gradient(135deg, #fa709a, #fee140); }
.gallery-grad-6 { background: linear-gradient(135deg, #a8edea, #fed6e3); }
.gallery-grad-7 { background: linear-gradient(135deg, #ff9a56, #ff6a88); }
.gallery-grad-8 { background: linear-gradient(135deg, #5B4FE9, #F97316); }

.gallery-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 24px;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.75));
    color: #fff;
    transform: translateY(40%);
    opacity: 0;
    transition: var(--transition);
}

.gallery-item:hover .gallery-overlay {
    transform: translateY(0);
    opacity: 1;
}

.gallery-overlay h3 {
    font-family: var(--font-head);
    font-size: 1.15rem;
    margin-bottom: 6px;
}

.gallery-overlay p {
    font-size: 0.85rem;
    opacity: 0.9;
    line-height: 1.5;
}

.gallery-item.hidden {
    display: none;
}

/* Real image gallery items */
.gallery-item img.sample-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
}

.gallery-item:hover img.sample-img {
    transform: scale(1.05);
}

/* Video gallery items */
.gallery-video {
    background: #1a1a2e;
}

.gallery-video video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.gallery-video .play-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 56px;
    height: 56px;
    background: var(--primary);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    pointer-events: none;
    z-index: 2;
    transition: var(--transition);
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
}

.gallery-video .play-overlay svg {
    width: 24px;
    height: 24px;
    margin-left: 2px;
}

.gallery-video:hover .play-overlay {
    transform: translate(-50%, -50%) scale(1.1);
    background: var(--primary-dark);
}

/* Document description cards in gallery */
.gallery-doc-card {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, var(--primary-light) 0%, var(--bg) 100%);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    text-align: center;
    transition: var(--transition);
}

.gallery-item:hover .gallery-doc-card {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
}

.gallery-doc-card .doc-icon {
    width: 48px;
    height: 48px;
    background: var(--primary);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    margin-bottom: 16px;
    transition: var(--transition);
}

.gallery-item:hover .gallery-doc-card .doc-icon {
    background: rgba(255, 255, 255, 0.2);
}

.gallery-doc-card .doc-icon svg {
    width: 24px;
    height: 24px;
}

.gallery-doc-card h3 {
    font-family: var(--font-head);
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
    transition: var(--transition);
}

.gallery-item:hover .gallery-doc-card h3 {
    color: #fff;
}

.gallery-doc-card p {
    font-size: 0.8rem;
    color: var(--text-light);
    line-height: 1.5;
    transition: var(--transition);
}

.gallery-item:hover .gallery-doc-card p {
    color: rgba(255, 255, 255, 0.85);
}

/* ================================
   CTA Banner
================================ */
.cta-banner {
    background: linear-gradient(135deg, var(--primary) 0%, #7B68EE 100%);
    padding: 80px 0;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.cta-banner::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: radial-gradient(circle, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
    background-size: 30px 30px;
}

.cta-content {
    position: relative;
    z-index: 1;
}

.cta-content h2 {
    font-family: var(--font-head);
    font-size: clamp(1.75rem, 4vw, 2.5rem);
    font-weight: 700;
    color: #fff;
    margin-bottom: 12px;
}

.cta-content p {
    font-size: 1.1rem;
    color: rgba(255, 255, 255, 0.9);
    margin-bottom: 32px;
}

.cta-banner .btn-primary {
    background: #fff;
    color: var(--primary);
}

.cta-banner .btn-primary:hover {
    background: var(--bg-white);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
}

/* ================================
   Contact
================================ */
.contact {
    background: var(--bg);
}

.contact-grid {
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    gap: 48px;
}

.contact-info h3 {
    font-family: var(--font-head);
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 16px;
    color: var(--text);
}

.contact-info > p {
    color: var(--text-light);
    margin-bottom: 32px;
    font-size: 1rem;
    line-height: 1.7;
}

.contact-details {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 32px;
}

.contact-detail-item {
    display: flex;
    align-items: center;
    gap: 16px;
    transition: var(--transition);
}

.contact-detail-item:hover {
    transform: translateX(4px);
}

.contact-icon {
    width: 48px;
    height: 48px;
    background: var(--primary-light);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary);
    flex-shrink: 0;
}

.contact-icon svg {
    width: 22px;
    height: 22px;
}

.contact-label {
    display: block;
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 2px;
}

.contact-value {
    display: block;
    font-weight: 500;
    color: var(--text);
}

.social-links {
    display: flex;
    gap: 12px;
}

.social-link {
    width: 44px;
    height: 44px;
    background: var(--bg-white);
    border: 1.5px solid var(--border);
